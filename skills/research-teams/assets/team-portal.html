  <style>

field dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.field.blocker dd{color:var(--red)}.acceptance{grid-column:2 / 4}.evidence{border-top:1px solid var(--line);margin-top:20px;padding-top:13px}.evidence summary{font-size:13px;color:var(--green);cursor:pointer;width:fit-content}.evidence-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}.evidence-list li{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.evidence-time{font-size:12px;color:var(--muted);margin-top:10px}.empty{border:1px dashed #cbd1c2;background:#fcfcf6;border-radius:9px;padding:52px 24px;text-align:center}.empty h3{font-size:18px}.empty p{color:var(--muted);margin-top:8px;font-size:14px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid transparent;padding:6px 13px;border-radius:5px;background:transparent;font-size:13px;color:var(--muted)}.filter[aria-pressed="true"]{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600}.mail-layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.8fr);gap:21px;align-items:start}.mail-list{display:grid;gap:9px}.mail-card{display:block;text-align:left;width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:17px 18px}.mail-card:hover{border-color:#a9b8a1}.mail-card[aria-current="true"]{border-color:var(--green);box-shadow:inset 3px 0 var(--green);background:#f7faf3}.mail-card-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted)}.mail-card h3{font-size:15px}.mail-card p{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.mail-card .decision-preview{color:var(--amber);-webkit-line-clamp:2}.mail-card time{font-size:11px;color:var(--muted);display:block;margin-top:12px}.reader{border:1px solid var(--line);border-radius:9px;back     @media(min-width:1500px){.shell{padding-top:48px}}@media(max-width:1000px){.shell{padding:28px 26px 22px}.metric{padding:17px 19px}.task-grid{column-gap:20px;grid-template-columns:.8fr 1.1fr 1.5fr}.connection{min-width:220px}.mail-layout{grid-template-columns:minmax(250px,.85fr) minmax(0,1.5fr)}.reader{padding:23px}.connection-detail{max-width:260px}}
    @media(max-width:740px){.shell{padding:25px 18px 20px}.masthead{display:block}.connection{text-align:left;padding-top:20px;min-width:0}.connection-top{justify-content:flex-start}.connection-detail{margin-left:0;max-width:none}.subtitle{font-size:13px}.tabs{margin-top:22px}.overview{grid-template-columns:repeat(2,1fr);margin:20px 0 26px}.metric{padding:14px 17px}.metric-value{font-size:25px}.section-heading{align-items:flex-start;flex-direction:column;gap:10px}.source-stamp{text-align:left}.task{padding:18px}.task-heading{display:block}.task-id{display:block;margin-bottom:3px}.task-grid{grid-template-columns:1fr 1fr;gap:15px 20px}.field.next,.acceptance{grid-column:1 / -1}.task-grid .field.blocker{grid-column:1 / -1}.task-top{gap:12px}.mail-layout{grid-template-columns:1fr}.mail-list{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.reader{padding:22px 19px;min-height:0}.reader h2{font-size:21px}.footer{display:block}.footer p+p{margin-top:6px}.notice{font-size:13px}.filters{gap:3px}.filter{padding:6px 12px}}
    @media(prefers-reduced-motion:no-preference){button,a{transition:background-color .12s,border-color .12s}}
    .task-detail{margin-top:16px}.task-detail>summary{font-size:14px;font-weight:600;color:var(--green);cursor:pointer;width:fit-content}.task-detail[open]>summary{padding-bottom:3px}.task-badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.report{margin-top:23px;max-width:960px}.report-header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}.report-header h4{font-size:18px;margin:0}.report-link{font-size:12px}.report-section{margin-top:24px}.report-section h5,.report-figures>h5,.report-evidence>h5,.phases>h5{font-size:15px;font-weight:650;margin:0 0 9px}.report-prose p{margin:0 0 13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95}.report-prose p:last-child{margin-bottom:0}.report-missing{padding:17px 19px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}.report-times{font-size:12px;color:var(--muted);margin-top:22px;display:flex;gap:5px 22px;flex-wrap:wrap}.report-evidence,.report-figures,.phases{border-top:1px solid var(--line);padding-top:21px;margin-top:25px}.report-figure{margin:21px 0 0;min-width:0}.report-figure h6{font-size:14px;margin:0 0 10px}.report-figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}.report-figure iframe{display:block;width:100%;height:550px;max-height:75vh;min-height:300px;border:1px solid var(--line);border-radius:6px;background:#fff}.report-figure figcaption{font-size:13px;color:var(--muted);margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.figure-open{display:inline-block;font-size:13px;margin-top:9px}.figure-unavailable{font-size:13px;color:var(--muted);padding:12px 15px;background:#f5f4ee;border-radius:5px;white-space:pre-wrap}.phase{border-left:2px solid #cbd5c5;padding:0 0 0 17px;margin-top:22px}.phase-heading{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}.phase-heading h6{font-size:14px;margin:0}.phase .evidence-list{margin-top:12px}.task-context{border-top:1px solid var(--line);margin-top:26px;padding-top:4px}.task-context h4{font-size:14px;margin:16px 0 0}.report-note{font-size:13px;color:var(--muted);margin:4px 0 16px}
    @media print{body{background:white}.shell{padding:0}.connection button,.tabs,.filters,.read-control button{display:none}.overview,.task,.reader{box-shadow:none;break-inside:avoid}.mail-layout{grid-template-columns:1fr}.mail-list{display:none}.footer{margin-top:20px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div><p class="eyebrow">团队协作 · 共享进展</p><h1 id="team-title">团队工作台</h1><p class="subtitle">查看任务、核对证据，让需要人参与的决定有清楚的去处。</p></div>
      <div class="connection"><div class="connection-top"><span id="connection-label" class="connection-label" role="status">正在载入</span><button id="refresh" class="button" type="button">刷新 / 重连</button></div><p id="connection-detail" class="connection-detail">页面保留来源时间，阅读状态由访问者手动标记。</p></div>
    </header>
    <div id="preview-notice" class="notice" hidden>静态预览，操作请打开共享网页。</div>
    <div id="error-notice" class="notice error" role="alert" hidden></div>
    <div id="source-notice" class="notice" role="status" hidden></div>
    <nav class="tabs" role="tablist" aria-label="工作台内容">
      <button id="tasks-tab" class="tab" type="button" role="tab" aria-selected="true" aria-controls="tasks-panel" tabindex="0">任务 <span id="tasks-count" class="tab-count">—</span></button>
      <button id="inbox-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="inbox-panel" tabindex="-1">收件箱 <span id="inbox-count" class="tab-count">—</span></button>
    </nav>
    <section class="overview" aria-label="团队概况">
      <div class="metric"><span class="metric-label">已完成 / 全部任务</span><span id="metric-completed" class="metric-value">—</span></div>
      <div class="metric"><span class="metric-label">未解决</span><span id="metric-unresolved" class="metric-value">—</span></div>
      <div class="metric accent"><span class="metric-label">存在阻碍</span><span id="metric-blocked" class="metric-value">—</span></div>
      <div class="metric accent"><span class="metric-label">未读消息</span><span id="metric-unread" class="metric-value">—</span></div>
    </section>
    <main>
      <section id="tasks-panel" role="tabpanel" aria-labelledby="tasks-tab">
        <div class="section-heading"><div><h2>任务列表</h2><p>责任、当前执行情况与下一步。</p></div><div class="source-stamp"><span id="updated-at">来源更新时间：尚未载入</span><span id="evidence-checked-at">证据核对时间：尚未载入</span></div></div>
        <div id="task-list" class="task-list"><p class="loading">正在载入任务…</p></div>
      </section>
      <section id="inbox-panel" role="tabpanel" aria-labelledby="inbox-tab" hidden>
        <div class="section-heading"><div><h2>人的收件箱</h2><p>先看影响与所需决定，再查看证据。打开消息不会改变已读状态。</p></div><div class="filters" role="group" aria-label="筛选阅读状态"><button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button><button class="filter" type="button" data-filter="unread" aria-pressed="false">未读</button><button class="filter" type="button" data-filter="read" aria-pressed="false">已读</button></div></div>
        <div class="mail-layout"><div id="mail-list" class="mail-list" aria-label="消息列表"></div><div id="mail-reader"></div></div>
      </section>
    </main>
    <footer class="footer"><p>“已读”由访问者手动标记，是所有访问者共享的阅读状态；不代表身份确认、批准或任务验收。</p><p id="receipts-at">阅读状态更新时间：尚未载入</p></footer>
  </div>
  <script>
    'use strict';
    (() => {
      const byId = id => document.getElementById(id);
      const preview = Object.prototype.hasOwnProperty.call(window, 'TEAM_PORTAL_SNAPSHOT');
      const statusNames = {pending:'待开始',in_progress:'进行中',completed:'已完成'};
      const problemNames = {unresolved:'未解决',resolved:'已解决',not_applicable:'不适用'};
      let state = null, stream = null, activeTab = 'tasks', filter = 'all', selectedId = null, loading = false, initialTaskLink = true;
      const pending = new Set(), expanded = new Set(), openReports = new Map();
      function readable(value, fallback = '未提供') {
        if (value === null || value === undefined || value === '') return fallback;
        if (Array.isArray(value)) return value.length ? value.map(item => readable(item, '—')).join('\n') : fallback;
        if (typeof value === 'object') {
          const entries = Object.entries(value);
          return entries.length ? entries.map(([key,val]) => key + '：' + readable(val, '—')).join('\n') : fallback;
        }
        return String(value);
      }
      function el(tag, className, content) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (content !== undefined) node.textContent = content;
        return node;
      }
      function stamp(value) {
        if (value === null || value === undefined || value === '') return '未提供';
        const raw = readable(value), date = new Date(raw);
        return Number.isNaN(date.getTime()) ? raw : date.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short',hour12:false});
      }
      function setTime(id, prefix, value) { const node = byId(id); node.textContent = prefix + stamp(value); node.title = readable(value, '未提供'); }
      function badge(text, kind) { return el('span','badge ' + (kind || ''),text); }
      function empty(title, text) { const node = el('div','empty'); node.append(el('h3','',title),el('p','',text)); return node; }
      function connection(text, kind, detail) {
        byId('connection-label').textContent = text;
        byId('connection-label').dataset.kind = kind || '';
        byId('connection-detail').textContent = detail;
      }
      function showError(message) { byId('error-notice').textContent = message; byId('error-notice').hidden = !message; }
      function safeUrl(raw) {
        if (typeof raw !== 'string') return null;
        try {
          if (raw.startsWith('/artifacts/') || raw.startsWith('/figures/')) {
            const url = new URL(raw, location.origin);
            return url.origin === location.origin && (url.pathname.startsWith('/artifacts/') || url.pathname.startsWith('/figures/')) ? url.href : null;
          }
          const url = new URL(raw);
          return ['http:', 'https:', 't3-thread:'].includes(url.protocol) ? url.href : null;
        } catch (_) { return null; }
      }
      function evidenceList(value) {
        const items = Array.isArray(value) ? value : (value ? [value] : []);
        const list = el('ul','evidence-list');
        if (!items.length) list.append(el('li','', '尚未提供证据。'));
        for (const item of items) {
          const row = el('li');
          const raw = item && typeof item === 'object' ? item.url : item;
          const label = item && typeof item === 'object' ? readable(item.label, readable(raw)) : readable(item);
          const url = safeUrl(raw);
          if (url) { const link = el('a','',label); link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer'; row.append(link); }
          else row.textContent = label + (raw && readable(raw) !== label ? ' · ' + readable(raw) : '');
          list.append(row);
        }
        return list;
      }
      function field(label, value, className, fallback) {
        const node = el('div','field ' + (className || ''));
        node.append(el('dt','',label),el('dd','',readable(value,fallback)));
        return node;
      }
      function unresolved(task) {
        return task.problem_status === 'unresolved' || (!['resolved','not_applicable'].includes(task.problem_status) && Boolean(task.unresolved));
      }
      function completed(task) { return task.status === 'completed' && !unresolved(task); }
      function linkedTaskId() {
        const match = /^#task=(.*)$/.exec(location.hash);
        if (!match) return null;
        try { return decodeURIComponent(match[1]); } catch (_) { return null; }
      }
      function prose(value, fallback = '未提供') {
        const node = el('div','report-prose');
        readable(value,fallback).split(/\n\s*\n/).forEach(paragraph => node.append(el('p','',paragraph)));
        return node;
      }
      function executionLabel(value) {
        const labels = {closed:'执行已结束',closed_gate_failed:'按门槛停止',waiting_next_step:'待下一步',paused:'已暂停',blocked:'数据或许可卡住',running:'正在执行',active:'正在执行',in_progress:'推进中',pending:'待开始',idle:'等待安排',waiting_human:'等待人参与',waiting_data:'等待数据',completed:'执行已结束'};
        if (typeof value === 'string' && value.startsWith('blocked_')) return '数据或许可卡住';
        if (typeof value === 'string' && value.startsWith('paused_')) return '已暂停';
        if (typeof value === 'string' && value.startsWith('waiting_') && !labels[value]) return '待下一步';
        return labels[value] || (value ? '执行情况待确认（' + readable(value) + '）' : '执行情况未提供');
      }
      function renderFigures(figures) {
        const section = el('section','report-figures'); section.append(el('h5','','图表与可视化'));
        figures.forEach((figure,index) => {
          if (!figure || typeof figure !== 'object') return;
          const node = el('figure','report-figure'), label = readable(figure.label,'图表 ' + (index + 1)), url = safeUrl(figure.url);
          node.append(el('h6','',label));
          if (figure.available !== true || !url) node.append(el('p','figure-unavailable',readable(figure.availability_note,'图表暂不可用。')));
          else {
            const parsed = new URL(url), registered = parsed.origin === location.origin && parsed.pathname.startsWith('/figures/');
            const embeddable = ['http:','https:'].includes(parsed.protocol) && (registered || figure.embed_safe === true);
            if (embeddable && figure.kind === 'image') {
              const picture = el('img'); picture.src = url; picture.alt = readable(figure.caption,label); picture.loading = 'lazy'; node.append(picture);
            } else if (embeddable && figure.kind === 'html') {

      function applyState(snapshot) {

      function closeStream() { if (stream) { stream.close(); stream = null; } }
      function connect() {
        closeStream();
        if (preview) return;
        if (!state?._portal?.live_updates) { connection('手动刷新','', '此页面未启用实时推送；点击“刷新 / 重连”获取最新状态。'); return; }

          } catch (_) { source.close(); if (stream === source) stream = null; connection('连接已停止','error','收到的数据无法解析，保留当前内容。请点击“刷新 / 重连”。'); }
